<style>
/* =========================================================
   YAARLYNX TASK MANAGEMENT - DESIGN SYSTEM
========================================================= */

:root {
    --yx: #153030;
    --yx2: #204747;
    --yx-soft: #eaf1ef;
    --yx-line: #e4ebe8;
    --yx-muted: #71817d;
    --yx-text: #243532;
    --yx-shadow: 0 5px 22px rgba(21, 48, 48, 0.045);
    --yx-radius: 18px;
}

/* =========================================================
   BASE
========================================================= */

.task-page {
    color: var(--yx-text);
    min-width: 0;
}

.task-page *,
.task-page *::before,
.task-page *::after {
    box-sizing: border-box;
}

.yx-muted {
    color: var(--yx-muted);
}

.yx-section-title {
    font-size: 14px;
    font-weight: 800;
    color: #203a35;
    line-height: 1.5;
}

/* =========================================================
   PANELS & CARDS
========================================================= */

.yx-panel {
    background: #fff;
    border: 1px solid var(--yx-line);
    border-radius: var(--yx-radius);
    box-shadow: var(--yx-shadow);
    min-width: 0;
}

.yx-kpi {
    background: linear-gradient(145deg, #fff, #f8fbfa);
    border: 1px solid var(--yx-line);
    border-radius: 17px;
    padding: 18px;
    min-width: 0;
    transition: transform .2s ease, box-shadow .2s ease;
}

.yx-kpi:hover {
    transform: translateY(-2px);
    box-shadow: 0 9px 24px rgba(21, 48, 48, .07);
}

.yx-kpi-icon {
    width: 42px;
    height: 42px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    background: var(--yx-soft);
    color: var(--yx);
    font-size: 19px;
    flex-shrink: 0;
}

/* =========================================================
   BUTTONS
========================================================= */

.yx-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border-radius: 11px;
    padding: 10px 15px;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.4;
    text-decoration: none;
    transition: all .18s ease;
    border: 1px solid transparent;
    cursor: pointer;
    white-space: nowrap;
}

.yx-btn:focus-visible {
    outline: 3px solid rgba(21, 48, 48, .2);
    outline-offset: 2px;
}

.yx-btn:disabled {
    opacity: .55;
    cursor: not-allowed;
    transform: none;
}

.yx-btn-primary {
    background: var(--yx);
    color: #fff;
}

.yx-btn-primary:hover {
    background: var(--yx2);
    color: #fff;
    transform: translateY(-1px);
}

.yx-btn-light {
    background: #f3f7f5;
    color: var(--yx);
    border-color: #e4ece8;
}

.yx-btn-light:hover {
    background: #e8f0ed;
    color: var(--yx);
}

.yx-btn-danger {
    background: #fff1f0;
    color: #b42318;
    border-color: #ffe0dc;
}

.yx-btn-danger:hover {
    background: #ffe6e3;
    color: #a51d13;
}

/* =========================================================
   FORM ELEMENTS
========================================================= */

.yx-input,
.yx-select,
.yx-textarea {
    width: 100%;
    min-width: 0;
    border: 1px solid #dce6e1;
    border-radius: 11px;
    padding: 10px 12px;
    background: #fff;
    color: #203633;
    font-size: 13px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
}

.yx-input,
.yx-select {
    min-height: 40px;
}

.yx-textarea {
    min-height: 100px;
    resize: vertical;
    line-height: 1.6;
}

.yx-input::placeholder,
.yx-textarea::placeholder {
    color: #a0aca7;
}

.yx-input:focus,
.yx-select:focus,
.yx-textarea:focus {
    border-color: #527a72;
    box-shadow: 0 0 0 3px rgba(21, 48, 48, .08);
}

.yx-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #425650;
    margin-bottom: 7px;
}

.yx-help {
    font-size: 11px;
    color: #84928d;
    margin-top: 5px;
    line-height: 1.5;
}

/* =========================================================
   TABLE
========================================================= */

.yx-table-wrap {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: inherit;
}

.yx-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
}

.yx-table th {
    text-align: left;
    padding: 12px 15px;
    background: #f7faf8;
    color: #72817c;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .08em;
    font-weight: 800;
    white-space: nowrap;
}

.yx-table td {
    padding: 14px 15px;
    border-top: 1px solid #edf1ef;
    font-size: 12px;
    vertical-align: middle;
}

.yx-table tbody tr {
    transition: background .15s ease;
}

.yx-table tbody tr:hover td {
    background: #fbfdfc;
}

/* =========================================================
   STATUS BADGES
========================================================= */

.yx-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    border-radius: 99px;
    padding: 5px 9px;
    font-size: 10px;
    font-weight: 800;
    line-height: 1.4;
    white-space: nowrap;
    background: #edf3f0;
    color: #31534b;
}

.yx-status-pending {
    background: #fff6e5;
    color: #9a6700;
}

.yx-status-accepted {
    background: #eaf3ff;
    color: #245ca6;
}

.yx-status-in_progress {
    background: #e9f2ff;
    color: #245ca6;
}

.yx-status-on_hold {
    background: #fff0e6;
    color: #a44b12;
}

.yx-status-under_review {
    background: #f2edff;
    color: #6841a5;
}

.yx-status-completed {
    background: #e8f7ee;
    color: #167044;
}

.yx-status-rejected,
.yx-status-cancelled {
    background: #fff0ef;
    color: #b42318;
}

/* =========================================================
   PRIORITY BADGES
========================================================= */

.yx-priority-low {
    background: #edf7f0;
    color: #26734a;
}

.yx-priority-medium {
    background: #fff7e8;
    color: #9b6b13;
}

.yx-priority-high {
    background: #fff0e8;
    color: #b44d19;
}

.yx-priority-urgent {
    background: #ffeded;
    color: #b42318;
}

/* =========================================================
   PROGRESS BAR
========================================================= */

.yx-progress {
    width: 100%;
    height: 7px;
    background: #edf2ef;
    border-radius: 99px;
    overflow: hidden;
}

.yx-progress > span {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 99px;
    background: linear-gradient(90deg, #153030, #6a9285);
    transition: width .3s ease;
}

/* =========================================================
   AVATAR
========================================================= */

.yx-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #e6efeb;
    color: #254b43;
    font-size: 11px;
    font-weight: 800;
    flex-shrink: 0;
}

/* =========================================================
   KANBAN BOARD
========================================================= */

.yx-board {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(280px, 320px);
    align-items: start;
    gap: 14px;
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 2px 2px 14px;
    scrollbar-width: thin;
    scrollbar-color: #bdcbc5 #f0f4f2;
    overscroll-behavior-x: contain;
}

.yx-board::-webkit-scrollbar {
    height: 7px;
}

.yx-board::-webkit-scrollbar-track {
    background: #f0f4f2;
    border-radius: 99px;
}

.yx-board::-webkit-scrollbar-thumb {
    background: #bdcbc5;
    border-radius: 99px;
}

.yx-column {
    background: #f3f7f5;
    border: 1px solid #e5ece8;
    border-radius: 16px;
    min-height: 260px;
    min-width: 0;
    padding: 12px;
}

.yx-task-card {
    background: #fff;
    border: 1px solid #e6ede9;
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 3px 12px rgba(21, 48, 48, .035);
    transition: transform .18s ease, box-shadow .18s ease;
    overflow-wrap: anywhere;
}

.yx-task-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 18px rgba(21, 48, 48, .07);
}

/* =========================================================
   EMPTY STATES
========================================================= */

.yx-empty {
    padding: 42px 18px;
    text-align: center;
    color: #81908a;
}

.yx-empty-icon {
    width: 54px;
    height: 54px;
    display: grid;
    place-items: center;
    margin: 0 auto 12px;
    border-radius: 17px;
    background: #edf3f0;
    color: var(--yx);
    font-size: 23px;
}

/* =========================================================
   PAGE HEADER
========================================================= */

.yx-page-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
    min-width: 0;
}

/* =========================================================
   RESPONSIVE DESIGN
========================================================= */

@media (max-width: 1024px) {
    .yx-board {
        grid-auto-columns: minmax(280px, 300px);
    }
}

@media (max-width: 640px) {
    .yx-kpi {
        padding: 14px;
    }

    .yx-page-head {
        align-items: flex-start;
        flex-direction: column;
    }

    .yx-table {
        min-width: 720px;
    }

    .yx-board {
        grid-auto-columns: 84vw;
        gap: 12px;
    }

    .yx-column {
        padding: 10px;
    }

    .yx-task-card {
        padding: 12px;
    }

    .yx-btn {
        padding: 9px 12px;
        font-size: 12px;
    }
}

@media (max-width: 380px) {
    .yx-board {
        grid-auto-columns: 88vw;
    }

    .yx-kpi {
        padding: 12px;
    }
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {
    .yx-kpi,
    .yx-btn,
    .yx-task-card,
    .yx-progress > span {
        transition: none;
    }

    .yx-kpi:hover,
    .yx-task-card:hover,
    .yx-btn-primary:hover {
        transform: none;
    }
}
</style>
